name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.1)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Credentials must persist here: peter-evans/create-pull-request pushes
      # the release branch via git using what checkout leaves behind.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Generate Release Notes
        id: generate_notes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          echo "## What's Changed" > release_notes.md

          # Features
          echo "### 🚀 Features" >> release_notes.md
          if [ -z "$LAST_TAG" ]; then
            git log --pretty=format:"* %s (%h)" --no-merges | grep -i "^feat:" >> release_notes.md || true
          else
            git log ${LAST_TAG}..HEAD --pretty=format:"* %s (%h)" --no-merges | grep -i "^feat:" >> release_notes.md || true
          fi

          # Bug Fixes
          echo -e "\n### 🐛 Bug Fixes" >> release_notes.md
          if [ -z "$LAST_TAG" ]; then
            git log --pretty=format:"* %s (%h)" --no-merges | grep -i "^fix:" >> release_notes.md || true
          else
            git log ${LAST_TAG}..HEAD --pretty=format:"* %s (%h)" --no-merges | grep -i "^fix:" >> release_notes.md || true
          fi

          # Other Changes
          echo -e "\n### 🔧 Other Changes" >> release_notes.md
          if [ -z "$LAST_TAG" ]; then
            git log --pretty=format:"* %s (%h)" --no-merges | grep -iv "^feat:\|^fix:" >> release_notes.md || true
          else
            git log ${LAST_TAG}..HEAD --pretty=format:"* %s (%h)" --no-merges | grep -iv "^feat:\|^fix:" >> release_notes.md || true
          fi

          # Escape content for GitHub Actions
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "RELEASE_NOTES<<$EOF" >> $GITHUB_ENV
          cat release_notes.md >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      # The dispatch input goes through env: so it stays data; expanded into the
      # script text it would be executable regardless of who supplies it.
      - name: Update version in pyproject.toml
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          sed -i "/^\[project\]/,/^\[/ s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml

      - name: Update README version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          sed -i "s/@v[0-9]\+\.[0-9]\+\.[0-9]\+/@v$VERSION/" README.md


      - name: Create pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: "release-${{ github.event.inputs.version }}"
          title: "Release v${{ github.event.inputs.version }}"
          body: "This pull request bumps the version to v${{ github.event.inputs.version }} and updates the necessary files."
          base: main
          labels: release
